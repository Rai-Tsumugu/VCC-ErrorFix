name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ─── MCP Server (TypeScript) ─────────────────────────────────────────────
  mcp-server:
    name: MCP Server (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-coverage
          path: mcp-server/coverage/
          retention-days: 7

  # ─── Build Executable (Windows) ──────────────────────────────────────────
  build-exe-windows:
    name: Build Executable (Windows)
    needs: [mcp-server]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        run: |
          npm run build:bundle
          npx pkg dist/bundle.cjs --targets node20-win-x64 --out-path bin --compress GZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-windows
          path: mcp-server/bin/bundle-win-x64.exe
          retention-days: 7

  # ─── Build Executables (macOS) ────────────────────────────────────────────
  build-exe-macos:
    name: Build Executables (macOS)
    needs: [mcp-server]
    if: github.event_name == 'push'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS executables
        run: |
          npm run build:bundle
          npx pkg dist/bundle.cjs --targets node20-macos-x64,node20-macos-arm64 --out-path bin --compress GZip

      - name: Sign executables (ad-hoc)
        run: |
          codesign --sign - bin/bundle-macos-x64
          codesign --sign - bin/bundle-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-macos
          path: |
            mcp-server/bin/bundle-macos-x64
            mcp-server/bin/bundle-macos-arm64
          retention-days: 7

  # ─── Commit all executables back to branch ────────────────────────────────
  commit-executables:
    name: Commit pre-built executables
    needs: [build-exe-windows, build-exe-macos]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: exe-windows
          path: mcp-server/bin/

      - name: Download macOS executables
        uses: actions/download-artifact@v4
        with:
          name: exe-macos
          path: mcp-server/bin/

      - name: Set execute permissions on macOS binaries
        run: chmod +x mcp-server/bin/bundle-macos-x64 mcp-server/bin/bundle-macos-arm64

      - name: Commit and push executables
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase origin ${{ github.ref_name }}
          git add mcp-server/bin/
          git diff --staged --quiet || \
            git commit -m "chore: update pre-built MCP server executables [skip ci]"
          git push origin ${{ github.ref_name }}

  # ─── Unity Package Validation ─────────────────────────────────────────────
  # Full C# unit tests require a Unity Editor license (run locally via
  # Unity Test Runner: Window > General > Test Runner > EditMode).
  # This job validates the package structure without Unity.
  unity-package:
    name: Unity Package Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate UPM package.json
        run: |
          echo "=== Validating package.json ==="
          python3 -c "
          import json, sys
          with open('package.json') as f:
              pkg = json.load(f)
          required = ['name', 'version', 'displayName', 'unity', 'type']
          for key in required:
              assert key in pkg, f'Missing required key: {key}'
          assert pkg['name'].startswith('com.'), f'Package name must start with com.: {pkg[\"name\"]}'
          print(f'  name: {pkg[\"name\"]}')
          print(f'  version: {pkg[\"version\"]}')
          print(f'  unity: {pkg[\"unity\"]}')
          print('package.json OK')
          "

      - name: Validate asmdef files are valid JSON
        run: |
          echo "=== Validating .asmdef files ==="
          find . -name "*.asmdef" -not -path "./.git/*" | while read f; do
            python3 -c "
          import json, sys
          with open('$f') as file:
              data = json.load(file)
          assert 'name' in data, 'Missing name field'
          print(f'  $f: OK (name={data[\"name\"]})')
            "
          done

      - name: Verify required Editor scripts exist
        run: |
          echo "=== Checking required source files ==="
          required=(
            "Editor/ErrorData.cs"
            "Editor/ErrorCollector.cs"
            "Editor/HttpServer.cs"
            "Editor/ErrorFixSettings.cs"
            "Editor/ErrorFixEditorWindow.cs"
            "Editor/VccErrorFixEditor.asmdef"
            "Editor/AssemblyInfo.cs"
          )
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "  $f: found"
            else
              echo "  ERROR: $f is missing" >&2
              exit 1
            fi
          done

      - name: Verify test files exist
        run: |
          echo "=== Checking test files ==="
          required=(
            "Tests/Editor/VccErrorFixTests.asmdef"
            "Tests/Editor/ErrorDataTests.cs"
            "Tests/Editor/ErrorCollectorTests.cs"
            "Tests/Editor/ErrorFixSettingsTests.cs"
          )
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "  $f: found"
            else
              echo "  ERROR: $f is missing" >&2
              exit 1
            fi
          done

      - name: Check C# files for obvious syntax issues
        run: |
          echo "=== Checking C# namespace declarations ==="
          for f in Editor/*.cs Tests/Editor/*.cs; do
            [ -f "$f" ] || continue
            # Each file should declare a namespace
            if ! grep -q "namespace RaiTsumugu.VccErrorFix" "$f"; then
              echo "  WARNING: $f has no RaiTsumugu.VccErrorFix namespace"
            else
              echo "  $f: OK"
            fi
          done
